name: Production flow

on:
  push:
    branches:
      - master

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup dependencies
        run: npm ci

      - name: Unit test
        run: npm test -- --runInBand --no-watchman

      - name: Validate Compose
        run: docker compose config --no-interpolate

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SSH_HOST }}
          SERVER_USER: ${{ secrets.SSH_USER }}
          SERVER_PATH: ${{ secrets.SSH_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/meme_deploy_key
          chmod 600 ~/.ssh/meme_deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/meme_deploy_key compose.yml "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/compose.yml"

          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/meme_deploy_key "$SERVER_USER@$SERVER_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/meme_deploy_key "$SERVER_USER@$SERVER_HOST" \
            "SERVER_PATH='$SERVER_PATH' bash -s" <<'REMOTE'
          set -eu

          cd "$SERVER_PATH"
          grep -q '^BOT_SECRET=.' .env
          test -s test.json

          docker compose pull
          docker compose up -d
          sleep 10
          test "$(docker inspect --format '{{.State.Running}}' picmemebot)" = true

          docker compose ps
          docker compose logs --tail=20
          REMOTE
